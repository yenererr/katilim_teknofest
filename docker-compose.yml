# Dokploy — web uygulaması + konuşma servisi
#
# Konuşma servisi dışarı açılmaz. Tarayıcı ona doğrudan bağlanamaz; istekler
# web uygulamasındaki /api/speech proxy'si üzerinden geçer. Böylece:
#   - HTTPS sayfadan HTTP servise giden karışık içerik sorunu oluşmaz,
#   - CORS yapılandırmasına gerek kalmaz,
#   - ses verisi kurum ağının dışına çıkmaz (şartname 5.9).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Konteyner ağı içinde servis adıyla çözümlenir.
      SPEECH_SERVICE_URL: http://speech:8001
    env_file:
      # Gizli anahtarlar depoda tutulmaz; Dokploy Environment sekmesinden gelir.
      - path: .env
        required: false
    ports:
      - "3000:3000"
    depends_on:
      # Konuşma servisi hazır olmasa da web ayağa kalkar; sesli özellikler
      # o süre boyunca 503 döner ve arayüz onları gizler.
      speech:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  speech:
    build:
      context: ./speech-service
      dockerfile: Dockerfile
    restart: unless-stopped
    # Dışarı port açılmaz: yalnızca web konteyneri erişir.
    expose:
      - "8001"
    environment:
      SPEECH_SERVICE_HOST: 0.0.0.0
      SPEECH_SERVICE_PORT: 8001
      # Sunucuda GPU yoksa CPU'ya uygun model. GPU varsa:
      #   SPEECH_DEVICE=cuda, STT_MODEL=large-v3-turbo, STT_COMPUTE_TYPE=float16
      SPEECH_DEVICE: cpu
      STT_MODEL: small
      STT_COMPUTE_TYPE: int8
      STT_LANGUAGE: tr
      PIPER_VOICE: tr_TR-dfki-medium
      MODELS_CACHE_DIR: /app/models
    volumes:
      # Modeller ilk çağrıda indirilir; hacim olmazsa her yeniden başlatmada
      # yüzlerce MB yeniden iner.
      - speech-models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 5s
      # Model indirme ilk açılışta uzun sürebilir.
      start_period: 120s
      retries: 5

volumes:
  speech-models:
